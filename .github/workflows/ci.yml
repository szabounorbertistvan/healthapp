name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# read-only token: these jobs check out the code and run checks, nothing else
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the migration gate diffs supabase/migrations against the commit this lands on
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Names, duplicate versions, and no migration that was already on the base
      # edited, deleted, renamed or added out of order (docs/MIGRATION_GATE.md).
      # It reads no database: whether production has applied them is the
      # separate pre-release check, `npm run db:gate -- --remote <ledger>`.
      - name: Migration gate
        run: node scripts/migration-gate.mjs --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # supabase/functions is not an npm workspace, so `npm run typecheck` never
      # reaches it, and these are Deno modules importing jsr: specifiers that tsc
      # cannot resolve either — until this job they were checked by nothing.
      # --node-modules-dir=auto stops Deno resolving their npm dependencies out
      # of the repo root's node_modules, which does not carry them.
      - run: deno check --node-modules-dir=auto supabase/functions/

  database:
    name: RLS policies (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration to a throwaway Postgres, then runs
      # supabase/tests/*.sql. A red job here means a permission leak.
      # pgTAP only needs the database container: migrations reference
      # auth.users, which ships in the Postgres image, not in GoTrue. Every
      # other service is skipped so the job is not waiting on a dozen
      # containers to become healthy before a single test can run.
      - run: >
          supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup

  # One commit status for Vercel's Deployment Checks, so a production build of
  # main is promoted only once every job above passed (docs/MIGRATION_GATE.md).
  # Posted by hand rather than through vercel/repository-dispatch/actions/status:
  # that action looks its job up by run id alone, so in a run with several jobs
  # it reports whichever job GitHub lists first. Push only — Vercel gates
  # production, which only main builds; no repository_dispatch trigger, which
  # would run CI a second time per push and share (and cancel) this group.
  vercel:
    name: Vercel gate
    needs: [check, functions, database]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report to Vercel Deployment Checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          desc="Typecheck, lint, tests, build, deno check and pgTAP passed"
          for r in $RESULTS; do
            if [ "$r" != success ]; then state=failure; desc="A CI job ended as: $r"; fi
          done
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="Vercel - healthapp: ci" \
            -f description="$desc" -f target_url="$RUN_URL"
          [ "$state" = success ]
