name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # supabase/functions is not an npm workspace, so `npm run typecheck` never
      # reaches it, and these are Deno modules importing jsr: specifiers that tsc
      # cannot resolve either — until this job they were checked by nothing.
      # --node-modules-dir=auto stops Deno resolving their npm dependencies out
      # of the repo root's node_modules, which does not carry them.
      - run: deno check --node-modules-dir=auto supabase/functions/

  database:
    name: RLS policies (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration to a throwaway local stack, then runs
      # supabase/tests/*.sql. A red job here means a permission leak.
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
